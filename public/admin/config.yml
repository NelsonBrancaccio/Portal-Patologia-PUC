backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/imagens"
public_folder: "/imagens"

collections:
  - name: "topicos"
    label: "Tópicos"
    folder: "src/content/topicos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - label: "Área"
        name: "area"
        widget: "select"
        options:
          - "Citopatologia"
          - "Endócrina"
          - "Ginecológica"
          - "Hematológica e Linfonodal"
          - "Hepatobiliar e Pâncreas"
          - "Mama"
          - "Óssea e Partes Moles"
          - "Patologia Geral"
          - "Pele"
          - "Pulmonar"
          - "Renal e Trato Urinário"
          - "Sistema Nervoso"
          - "Trato Gastrointestinal"
      - { label: "Atualizado em", name: "atualizado", widget: "datetime" }
      - label: "Palavras-chave (tags)"
        name: "tags"
        widget: "list"
        required: false
        hint: "Uso interno — ajuda a busca no topo do site a encontrar este tópico. Não aparece na página publicada. Digite uma palavra por linha (ex: adenocarcinoma, cólon, TNM)."
      - label: "Parágrafo introdutório"
        name: "intro"
        widget: "text"
        required: false
        hint: "Opcional. Se deixado vazio, a página não mostra nenhum espaço em branco no lugar."
      - { label: "Imagem principal (pequena, no topo)", name: "imagem_principal", widget: "image", required: false }
      - label: "Conteúdo"
        name: "body"
        widget: "markdown"
        hint: "Use ## para os títulos das 5 seções: Definição / conceito, Quadro clínico, Diagnóstico, Relevância prática, Referências."
      - label: "Imagens reais do caso (lâminas)"
        name: "imagens_reais"
        widget: "list"
        required: false
        hint: "Aparecem no rodapé da página, cada uma com título e observação opcional."
        fields:
          - { label: "Arquivo", name: "arquivo", widget: "image" }
          - { label: "Título da imagem", name: "titulo", widget: "string" }
          - { label: "Observação (opcional)", name: "observacao", widget: "text", required: false }

  - name: "professores"
    label: "Professores"
    folder: "src/content/professores"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome", name: "nome", widget: "string" }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Está na ativa?", name: "ativo", widget: "boolean", default: false }
      - { label: "Período (ex: desde 2010, ou 1998–2015)", name: "periodo", widget: "string", required: false }
      - { label: "E-mail de contato (só se estiver na ativa)", name: "contato_email", widget: "string", required: false }
      - { label: "Telefone de contato (só se estiver na ativa)", name: "contato_telefone", widget: "string", required: false }
      - { label: "História breve", name: "body", widget: "markdown" }

  - name: "institucional"
    label: "Página Sobre"
    folder: "src/content/institucional"
    create: false
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: "configuracoes"
    label: "Páginas Institucionais"
    files:
      - name: "site"
        label: "Home e Tópicos — textos e imagens"
        file: "src/content/configuracoes/site.json"
        fields:
          - { label: "Home — título", name: "home_titulo", widget: "string", required: false }
          - { label: "Home — texto de introdução", name: "home_texto", widget: "text", required: false, hint: "Se vazio, usa um texto padrão." }
          - { label: "Home — imagem institucional", name: "home_imagem", widget: "image", required: false }
          - { label: "Home — legenda da imagem", name: "home_imagem_legenda", widget: "string", required: false }
          - { label: "Tópicos — texto de introdução", name: "topicos_texto", widget: "text", required: false }
          - { label: "Tópicos — imagem institucional", name: "topicos_imagem", widget: "image", required: false }
          - { label: "Tópicos — legenda da imagem", name: "topicos_imagem_legenda", widget: "string", required: false }
