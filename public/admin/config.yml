backend:
  name: git-gateway
  branch: main

media_folder: "public/imagens"
public_folder: "/imagens"

collections:
  - name: "topicos"
    label: "Tópicos"
    folder: "src/content/topicos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - label: "Área"
        name: "area"
        widget: "select"
        options:
          - "Patologia Geral"
          - "Trato Gastrointestinal"
          - "Hepatobiliar e Pâncreas"
          - "Mama"
          - "Ginecológica"
          - "Pulmonar"
          - "Renal e Trato Urinário"
          - "Óssea e Partes Moles"
          - "Sistema Nervoso"
          - "Hematológica e Linfonodal"
          - "Endócrina"
          - "Pele"
          - "Citopatologia"
      - { label: "Atualizado em", name: "atualizado", widget: "datetime" }
      - { label: "Imagem principal", name: "imagem_principal", widget: "image", required: false }
      - label: "Conteúdo"
        name: "body"
        widget: "markdown"
        hint: "Use ## para os títulos das 5 seções: Definição / conceito, Quadro clínico, Diagnóstico, Relevância prática, Referências. Insira imagens de lâmina direto no texto pelo botão de imagem."

  - name: "professores"
    label: "Professores"
    folder: "src/content/professores"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome", name: "nome", widget: "string" }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Está na ativa?", name: "ativo", widget: "boolean", default: false }
      - { label: "Período (ex: desde 2010, ou 1998–2015)", name: "periodo", widget: "string", required: false }
      - { label: "E-mail de contato (só se estiver na ativa)", name: "contato_email", widget: "string", required: false }
      - { label: "Telefone de contato (só se estiver na ativa)", name: "contato_telefone", widget: "string", required: false }
      - { label: "História breve", name: "body", widget: "markdown" }

  - name: "institucional"
    label: "Página Sobre"
    folder: "src/content/institucional"
    create: false
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
